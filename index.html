<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#2E3FA3">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="درب الأبطال">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<title>درب الأبطال</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lalezar&family=Readex+Pro:wght@400;500;600;700&display=swap">
<style>
/* Layout: one centered column, a belt-rank strip on top, four tabs below.
   Palette: indigo ink (dobok dye), amber for effort, teal for done. */
:root{
  --bg:#F2F4FA; --surface:#FFFFFF; --surface-2:#E8ECF8; --ink:#10173A; --ink-2:#4B5382; --line:#D8DDEE;
  --primary:#2E3FA3; --on-primary:#FFFFFF; --accent:#FFA91F; --on-accent:#2A1A00; --good:#0F9F86; --bad:#D6453D;
  --fig:#10173A; --fig-far:#8E96C6; --skin:#EDB58C; --skin-far:#C98B63; --shirt:#F0623A; --shirt-far:#B8492C; --shorts:#27337E; --shorts-far:#56619F; --shoe:#1D2340; --shoe-far:#626A96; --hair:#2E1D15; --mat:#E3E8F7; --mat-2:#D3DAF0;
  --shadow:0 1px 2px rgba(16,23,58,.06),0 10px 28px rgba(16,23,58,.07);
  --sa:#E8694A; --sb:#12A58F; --sc:#E39A12; --sd:#5568E8; --sw:#D6409F;
  --display:'Lalezar','Readex Pro','Segoe UI',Tahoma,sans-serif;
  --body:'Readex Pro','Segoe UI',Tahoma,'Noto Sans Arabic',system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0B1026; --surface:#151C42; --surface-2:#1E2656; --ink:#EEF0FF; --ink-2:#A8AFD9; --line:#2A3366;
  --primary:#7C8CFF; --on-primary:#0B1026; --accent:#FFB84A; --on-accent:#2A1A00; --good:#2BD3B2; --bad:#FF7A70;
  --fig:#EEF0FF; --fig-far:#6F79B8; --skin:#EDB58C; --skin-far:#B47D5A; --shirt:#FF7A4D; --shirt-far:#B65535; --shorts:#5B6CF0; --shorts-far:#3A469E; --shoe:#EEF0FF; --shoe-far:#8A93C8; --hair:#3B271C; --mat:#1A2250; --mat-2:#232C66;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.35);
  --sa:#FF8A6B; --sb:#2BD3B2; --sc:#FFC654; --sd:#8E9BFF; --sw:#FF7EC8; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B1026; --surface:#151C42; --surface-2:#1E2656; --ink:#EEF0FF; --ink-2:#A8AFD9; --line:#2A3366;
  --primary:#7C8CFF; --on-primary:#0B1026; --accent:#FFB84A; --on-accent:#2A1A00; --good:#2BD3B2; --bad:#FF7A70;
  --fig:#EEF0FF; --fig-far:#6F79B8; --skin:#EDB58C; --skin-far:#B47D5A; --shirt:#FF7A4D; --shirt-far:#B65535; --shorts:#5B6CF0; --shorts-far:#3A469E; --shoe:#EEF0FF; --shoe-far:#8A93C8; --hair:#3B271C; --mat:#1A2250; --mat-2:#232C66;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.35);
  --sa:#FF8A6B; --sb:#2BD3B2; --sc:#FFC654; --sd:#8E9BFF; --sw:#FF7EC8; color-scheme:dark}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.7;direction:rtl;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));-webkit-font-smoothing:antialiased}
button{font-family:inherit;color:inherit}
h1,h2,h3,h4{font-family:var(--display);font-weight:400;line-height:1.3;margin:0;text-wrap:balance}
p{margin:0}
.ic{display:inline-block;vertical-align:middle;flex:none}
.muted{color:var(--ink-2)}
.num{font-variant-numeric:tabular-nums}
:focus-visible{outline:3px solid var(--primary);outline-offset:2px;border-radius:10px}

#app{max-width:560px;margin:0 auto;padding-block:12px 112px}
.top{display:flex;align-items:center;justify-content:space-between;padding:6px 2px 14px}
.brand{display:flex;align-items:center;gap:10px}
.brand h1{font-size:26px;letter-spacing:.2px}
.brand svg{width:46px;height:auto}
.sync{font-size:12px;color:var(--ink-2);display:flex;align-items:center;gap:6px}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--good);display:inline-block}
.sync.off i{background:var(--accent)}

section.blk{margin-top:16px}
.eyebrow{font-size:13px;color:var(--ink-2)}
.hello h1{font-size:34px;margin-top:2px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;margin:26px 2px 10px}
.sec-h h2{font-size:23px}
.sec-h small{color:var(--ink-2);font-size:13px}

.card{background:var(--surface);border-radius:22px;padding:16px;box-shadow:var(--shadow)}
.note{border-radius:16px;padding:12px 14px;font-size:13.5px;background:var(--surface-2);color:var(--ink);margin-top:12px}
.note.warn{background:color-mix(in srgb,var(--accent) 22%,var(--surface));}

/* belt card */
.belt{display:grid;grid-template-columns:96px 1fr;gap:14px;align-items:center;margin-top:14px}
.belt svg{width:96px;height:auto}
.belt h3{font-size:21px}
.bar{height:10px;border-radius:99px;background:var(--surface-2);overflow:hidden;margin-top:8px}
.bar>i{display:block;height:100%;border-radius:99px;background:var(--bc,var(--primary));transition:width .6s ease}
.belt .small{font-size:13px;color:var(--ink-2);margin-top:6px}

/* hero */
.hero{margin-top:16px;border-radius:26px;background:var(--surface);box-shadow:var(--shadow);overflow:hidden}
.stage{position:relative;background:radial-gradient(120% 100% at 50% 0%,color-mix(in srgb,var(--tint,var(--sa)) 16%,var(--surface)),var(--surface) 70%);aspect-ratio:240/170;width:100%}
.hero .stage{max-height:240px}
.fig,.figsvg{width:100%;height:100%;display:block}
.figsvg .floor{fill:var(--mat)}
.figsvg .gline{stroke:var(--mat-2);stroke-width:2}
.figsvg .shadow{fill:var(--ink);opacity:.12}
.figsvg .wall{fill:var(--mat-2)}
.figsvg .rope{fill:none;stroke:var(--ink-2);stroke-width:1.5;stroke-dasharray:3 5;opacity:.6}
.figsvg .ropedot{fill:var(--accent)}
.figsvg .barl{stroke:var(--ink);stroke-width:4;stroke-linecap:round}.figsvg .barp{stroke:var(--mat-2);stroke-width:5;stroke-linecap:round}
.figsvg line{stroke-linecap:round;fill:none}
.figsvg .far{--k:var(--skin-far);--s:var(--shirt-far);--o:var(--shorts-far);--e:var(--shoe-far)}
.figsvg .near,.figsvg.fr .far{--k:var(--skin);--s:var(--shirt);--o:var(--shorts);--e:var(--shoe)}
.figsvg line.k{stroke:var(--k)}.figsvg circle.k{fill:var(--k)}.figsvg .s{stroke:var(--s)}.figsvg .o{stroke:var(--o)}.figsvg .e{stroke:var(--e)}
.figsvg .hair{fill:var(--hair)}.figsvg .eye{fill:#22160F}
#overlay{position:relative;z-index:70}
.exgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.exc{background:var(--surface);border:0;border-radius:14px;padding:6px 6px 8px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;font:inherit;color:var(--ink);box-shadow:var(--shadow);min-width:0}
.exc .fig{aspect-ratio:240/170;height:auto;border-radius:10px;background:var(--surface-2)}
.exc b{font-size:12.5px;line-height:1.35;text-align:center}.exc small{font-size:11px;color:var(--primary);display:flex;align-items:center;gap:3px}
#cele{position:fixed;inset:0;z-index:95;display:grid;place-items:center;overflow:hidden;text-align:center;color:#fff;background:radial-gradient(circle at 50% 42%,#33295f 0%,#120f2a 55%,#07060f 100%);animation:cfade .35s ease;padding:20px}
#cele.bye{animation:cfade .35s ease reverse forwards}
@keyframes cfade{from{opacity:0}to{opacity:1}}
#cele .rays{position:absolute;left:50%;top:40%;width:170vmax;height:170vmax;margin:-85vmax 0 0 -85vmax;background:repeating-conic-gradient(from 0deg,color-mix(in srgb,var(--bc,#FFD54A) 30%,transparent) 0 9deg,transparent 9deg 20deg);opacity:0;transition:opacity .8s;animation:spin 22s linear infinite}
#cele.open .rays{opacity:1}
@keyframes spin{to{transform:rotate(360deg)}}
#cele .flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
#cele.open .flash{animation:flash .6s ease-out}
@keyframes flash{0%{opacity:.85}100%{opacity:0}}
#cele .cin{position:relative;z-index:2;max-width:420px;width:100%}
.c-eyebrow{font-size:15px;letter-spacing:.5px;color:#FFD54A;margin:0}
.c-title{font-family:var(--display);font-size:34px;margin:4px 0 0;color:#fff}
#cele.open .c-title.pre,#cele.open .c-eyebrow{display:none}
.gstage{position:relative;height:270px;display:grid;place-items:center}
.gift{position:relative;width:170px;height:170px;border:0;background:none;cursor:pointer;animation:bob 1.5s ease-in-out infinite;transition:transform .5s,opacity .5s}
@keyframes bob{0%,100%{transform:translateY(0) rotate(0)}25%{transform:translateY(-8px) rotate(-3deg)}75%{transform:translateY(-4px) rotate(3deg)}}
#cele.opening .gift{animation:shake .12s linear infinite}
@keyframes shake{0%{transform:translate(0,0) rotate(0)}25%{transform:translate(-5px,2px) rotate(-6deg)}50%{transform:translate(4px,-2px) rotate(5deg)}75%{transform:translate(-3px,1px) rotate(-4deg)}100%{transform:translate(0,0) rotate(0)}}
.gift .box{position:absolute;left:18px;right:18px;bottom:6px;height:104px;border-radius:12px;background:linear-gradient(160deg,#FF7A55,#C63E27);box-shadow:inset 0 -10px 0 rgba(0,0,0,.15),0 18px 30px rgba(0,0,0,.45);transition:transform .6s .15s,opacity .6s .15s}
.gift .box::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:24px;margin-left:-12px;background:linear-gradient(#FFE08A,#E9A21C)}
.gift .lid{position:absolute;left:8px;right:8px;top:44px;height:36px;border-radius:10px;background:linear-gradient(160deg,#FF8E6C,#E2573A);box-shadow:0 6px 10px rgba(0,0,0,.25);z-index:2;transition:transform .8s cubic-bezier(.2,.8,.2,1),opacity .8s}
.gift .lid::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:26px;margin-left:-13px;background:linear-gradient(#FFE08A,#E9A21C)}
.bow{position:absolute;left:50%;top:-30px;width:0;height:0}
.bow i{position:absolute;top:0;width:44px;height:34px;border:9px solid #F4B63F;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;background:transparent}
.bow i:first-child{right:0;transform:rotate(-18deg)}.bow i:last-child{left:0;transform:rotate(18deg)}
#cele.open .lid{transform:translate(70px,-300px) rotate(60deg);opacity:0}
#cele.open .box{transform:translateY(60px) scale(.7);opacity:0}
#cele.open .gift{animation:none;pointer-events:none}
.prize{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(0) rotate(-25deg);filter:drop-shadow(0 0 22px color-mix(in srgb,var(--bc) 70%,#fff));pointer-events:none}
#cele.open .prize{animation:prize 1s .25s cubic-bezier(.2,1.5,.35,1) forwards}
@keyframes prize{0%{transform:translate(-50%,-10%) scale(0) rotate(-25deg)}60%{transform:translate(-50%,-62%) scale(1.15) rotate(6deg)}100%{transform:translate(-50%,-50%) scale(1) rotate(0)}}
#cele .after{opacity:0;transform:translateY(20px);pointer-events:none}
#cele.open .after{animation:up .6s .9s ease forwards;pointer-events:auto}
.c-belt{font-family:var(--display);font-size:40px;margin:0;color:var(--bc);text-shadow:0 2px 0 rgba(0,0,0,.35),0 0 18px rgba(255,255,255,.25)}
.c-rank{font-size:17px;margin:2px 0 0;color:#EDEBFF}.c-next{font-size:14px;color:#B9B5E6;margin:4px 0 0}
.c-btn{margin-top:18px}#cele .c-btn{background:#FFD54A;color:#2A1A00;font-size:19px;box-shadow:0 8px 24px rgba(255,213,74,.35)}
#cele .confetti{z-index:0}
#cele.war{background:radial-gradient(circle at 50% 45%,#5a120c 0%,#1d0705 55%,#060202 100%)}
#cele.war .embers i{animation-name:rise}
@keyframes rise{from{transform:translateY(0);opacity:1}to{transform:translateY(-105vh);opacity:0}}
#cele.war .wrap{animation:quake .5s 1.5s}
@keyframes quake{0%,100%{transform:none}20%{transform:translate(-8px,4px)}40%{transform:translate(7px,-5px)}60%{transform:translate(-5px,3px)}80%{transform:translate(4px,-2px)}}
.w1{font-size:19px;color:#F5D9C8;opacity:0;animation:w1 1.4s .2s ease forwards}
@keyframes w1{0%{opacity:0;transform:translateY(10px)}35%,70%{opacity:1;transform:none}100%{opacity:.55}}
.wshield{margin:6px auto 0;width:150px;opacity:0;transform:scale(3);animation:slam .45s 1.25s cubic-bezier(.5,0,.75,0) forwards;filter:drop-shadow(0 0 30px rgba(255,90,40,.6))}
@keyframes slam{to{opacity:1;transform:scale(1)}}
.wtitle{font-family:var(--display);font-size:50px;margin:8px 0 0;background:linear-gradient(180deg,#FFE08A,#FF7A2F 60%,#D9301F);-webkit-background-clip:text;background-clip:text;color:transparent;opacity:0;animation:up .6s 1.9s ease forwards;filter:drop-shadow(0 3px 12px rgba(255,80,30,.5))}
.w2{font-size:16px;color:#F5D9C8;opacity:0;animation:up .6s 2.3s ease forwards;margin:6px 0 0}
#cele .w3{opacity:0;animation:up .6s 2.8s ease forwards;background:linear-gradient(180deg,#FFD54A,#F2992E);color:#2A0E00}
:root[data-stage="w"]{--bg:#F6EEE4;--surface:#FFFBF6;--surface-2:#F0E1D0;--ink:#26120E;--ink-2:#7A4B3E;--line:#E6D2BE;--primary:#A8261C;--on-primary:#fff;--accent:#D99A1E;--mat:#EBDBC7;--mat-2:#DCC5AB;--shirt:#2A2020;--shirt-far:#4A3B3A;--shorts:#B3261E;--shorts-far:#7E1F18;--shoe:#2A2020;--sw:#C2301F}
@media (prefers-color-scheme:dark){:root[data-stage="w"]:not([data-theme="light"]){--bg:#120A09;--surface:#1F1311;--surface-2:#2C1A17;--ink:#FBEFE6;--ink-2:#C9A89A;--line:#3B2420;--primary:#FF6A55;--on-primary:#1A0705;--accent:#F2B33D;--mat:#2A1714;--mat-2:#3B211D;--shirt:#F1E6D8;--shirt-far:#B9A999;--shorts:#D7372A;--shorts-far:#8E2219;--shoe:#F1E6D8;--sw:#FF6A55}}
:root[data-stage="w"][data-theme="dark"]{--bg:#120A09;--surface:#1F1311;--surface-2:#2C1A17;--ink:#FBEFE6;--ink-2:#C9A89A;--line:#3B2420;--primary:#FF6A55;--on-primary:#1A0705;--accent:#F2B33D;--mat:#2A1714;--mat-2:#3B211D;--shirt:#F1E6D8;--shirt-far:#B9A999;--shorts:#D7372A;--shorts-far:#8E2219;--shoe:#F1E6D8;--sw:#FF6A55}
:root[data-stage="w"] body{background-image:radial-gradient(1200px 500px at 50% -120px,color-mix(in srgb,var(--primary) 16%,transparent),transparent 70%);background-attachment:fixed}
:root[data-stage="w"] .brand h1{background:linear-gradient(180deg,var(--accent),var(--primary));-webkit-background-clip:text;background-clip:text;color:transparent}
.stagebar{display:flex;align-items:center;gap:10px;margin-top:12px;padding:10px 14px;border-radius:16px;background:linear-gradient(90deg,color-mix(in srgb,var(--primary) 16%,var(--surface)),var(--surface));border:1px solid color-mix(in srgb,var(--primary) 30%,transparent);font-size:14px}
.stagebar b{font-family:var(--display);font-size:18px;color:var(--primary);font-weight:400}

.en{margin:-6px 0 8px;color:var(--ink-2);font-size:13px;text-align:end}
.vid{margin-top:14px}.vbtn{width:100%}
.vframe{position:relative;width:100%;aspect-ratio:16/9;border-radius:16px;overflow:hidden;background:#000}
.vframe.sh{aspect-ratio:9/16;max-height:62vh;width:auto;margin:0 auto}
.vframe iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.ylink{display:inline-block;margin-top:8px;font-size:14px;color:var(--primary)}
.howbtn{display:flex;justify-content:center;margin:-4px 0 6px}.howbtn .chip{border:0;cursor:pointer;font:inherit;font-size:14px;font-weight:600;min-height:36px}
.hero-body{padding:16px 18px 18px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:99px;padding:3px 12px;font-size:13px;background:var(--surface-2);color:var(--ink)}
.chip.tint{background:color-mix(in srgb,var(--tint) 24%,var(--surface));font-weight:600}
.chip.tint::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--tint)}
.hero h2{font-size:30px;margin-top:10px}
.hero .desc{color:var(--ink-2);margin-top:2px}
.meta{display:flex;gap:16px;margin-top:10px;font-size:14px;color:var(--ink-2)}
.meta span{display:inline-flex;align-items:center;gap:6px}
.tired{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:14px;padding:10px 14px;background:var(--surface-2);border-radius:16px;cursor:pointer;font-size:14px;width:100%;border:0;text-align:right}
.sw{width:46px;height:28px;border-radius:99px;background:var(--line);position:relative;flex:none;transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;right:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.sw.on{background:var(--good)}.sw.on::after{transform:translateX(-18px)}
.btn{font-family:var(--display);font-size:21px;border:0;border-radius:18px;padding:12px 22px;min-height:58px;background:var(--primary);color:var(--on-primary);cursor:pointer;width:100%;display:flex;align-items:center;justify-content:center;gap:10px;transition:transform .12s}
.btn:active{transform:scale(.98)}
.btn.sec{background:var(--surface-2);color:var(--ink)}
.btn.acc{background:var(--accent);color:var(--on-accent)}
.btn.good{background:var(--good);color:#04251F}
.btn.sm{font-size:17px;min-height:46px;border-radius:14px;padding:8px 16px;width:auto}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.hero .btn{margin-top:14px}
.link{background:none;border:0;color:var(--primary);cursor:pointer;font-size:14px;padding:6px 0;text-decoration:underline;text-underline-offset:3px}

/* week strip */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.day{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;color:var(--ink-2)}
.dot{width:100%;max-width:44px;aspect-ratio:1;border-radius:50%;display:grid;place-items:center;background:var(--surface-2);font-size:14px;color:var(--ink-2);position:relative}
.dot.done{background:var(--good);color:#04251F}
.dot.today{box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--primary)}
.goal{display:flex;align-items:center;justify-content:space-between;margin-top:12px;font-size:14px}

/* generic rows */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--surface);border-radius:18px;padding:12px 10px;text-align:center;box-shadow:var(--shadow)}
.stat b{display:block;font-family:var(--display);font-weight:400;font-size:30px;line-height:1.1}
.stat span{font-size:12.5px;color:var(--ink-2)}
.stat .ic{color:var(--accent)}
.list{display:flex;flex-direction:column;gap:10px}
.row{display:flex;align-items:center;gap:12px;background:var(--surface);border-radius:18px;padding:12px 14px;box-shadow:var(--shadow);border:0;width:100%;text-align:right;cursor:pointer}
.row.static{cursor:default}
.row .grow{flex:1;min-width:0}
.row h4{font-size:19px}
.row .sub{font-size:13px;color:var(--ink-2)}
.thumb{width:68px;height:48px;border-radius:12px;overflow:hidden;flex:none;background:var(--surface-2)}
.badge-n{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-family:var(--display);font-size:20px;background:color-mix(in srgb,var(--tint,var(--primary)) 22%,var(--surface));flex:none}
.state{font-size:12.5px;border-radius:99px;padding:2px 10px;background:var(--surface-2);white-space:nowrap}
.state.ok{background:var(--good);color:#04251F}
.state.now{background:var(--accent);color:var(--on-accent)}
.quest{display:flex;align-items:center;gap:12px;background:var(--surface);border-radius:18px;padding:12px 14px;box-shadow:var(--shadow);border:0;width:100%;text-align:right;cursor:pointer;font-size:15px;min-height:68px;color:var(--ink)}
.quest .qk{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;flex:none;background:color-mix(in srgb,var(--tint) 24%,var(--surface))}
.quest .qt{flex:1;min-width:0;line-height:1.6}

/* ============ store (cloud db, with local fallback) ============ */
const COLS=['settings','logs','comments','checks','challenges','quests'];
const Store=(function(){
  const LSK='darb.cache.v1',PQ='darb.pending.v1';
  let remote=lsGet(LSK,null)||{};COLS.forEach(c=>{if(!Array.isArray(remote[c]))remote[c]=[]});
  let pending=lsGet(PQ,[]),db=null,mode='boot',synced=false,subs=[],cbs=[],busy=false;
  const emit=()=>cbs.forEach(f=>f());
  function get(c){const m=new Map(remote[c].map(d=>[d.id,d]));pending.filter(p=>p.col===c).forEach(p=>m.set(p.id,Object.assign({},p.data,{id:p.id})));return Array.from(m.values())}
  function upsert(c,id,doc){remote[c]=remote[c].filter(d=>d.id!==id).concat([Object.assign({},doc,{id:id})]);lsSet(LSK,remote)}
  async function flush(){
    if(busy||mode!=='cloud')return;busy=true;
    for(const p of pending.slice()){
      try{await db.collection(p.col).doc(p.id).set(p.data);pending=pending.filter(x=>x!==p);upsert(p.col,p.id,p.data);lsSet(PQ,pending)}catch(e){break}}
    busy=false;emit();
  }
  async function put(c,id,data){
    const doc=Object.assign({},data);delete doc.id;
    pending=pending.filter(p=>!(p.col===c&&p.id===id));pending.push({col:c,id:id,data:doc});lsSet(PQ,pending);emit();
    if(mode==='cloud')await flush();else if(mode==='local'){pending=pending.filter(p=>!(p.col===c&&p.id===id));lsSet(PQ,pending);upsert(c,id,doc);emit()}
  }
  function attach(d){
    db=d;
    if(!db){mode='local';synced=true;pending.forEach(p=>{remote[p.col]=remote[p.col].filter(x=>x.id!==p.id).concat([Object.assign({},p.data,{id:p.id})])});pending=[];lsSet(LSK,remote);lsSet(PQ,[]);emit();return}
    mode='cloud';
    COLS.forEach(c=>{
      try{subs.push(db.collection(c).onSnapshot(s=>{remote[c]=s.docs.map(x=>Object.assign({},x.data(),{id:x.id}));lsSet(LSK,remote);
        if(!s.metadata.fromCache)synced=true;emit();flush()},()=>{synced=false;emit()}))}catch(e){}});
    setTimeout(()=>{if(!synced){emit()}},10000);
    flush();
  }
  return {get:get,put:put,attach:attach,cb:f=>cbs.push(f),get mode(){return mode},get synced(){return synced},get pending(){return pending.length}};
})();

function derive(){
  const cf=cfg(),now=new Date(),today=ymd(now);
  const logs=Store.get('logs').slice().sort((a,b)=>a.at<b.at?-1:a.at>b.at?1:0);
  const comments=Store.get('comments').slice().sort((a,b)=>a.at<b.at?1:-1);
  const checks=Store.get('checks').slice().sort((a,b)=>a.at<b.at?-1:1);
  const chal=Store.get('challenges');
  const regl=logs.filter(l=>!isW(l)),wl=logs.filter(isW),since0=cf.programStartAt;
  const prog=since0?regl.filter(l=>l.at>=since0):regl,wprog=since0?wl.filter(l=>l.at>=since0):wl;
  const n=prog.length,per=cf.perWeek,week=Math.floor(n/per)+1,key='ABCD'[n%4],wn=wprog.length,wkey='W'+(wn%4+1),wweek=Math.min(4,Math.floor(wn/4)+1);
  const quests=Store.get('quests'),qToday=quests.find(q=>q.id===today)||null,fullQ=q=>q.d&&q.d.b&&q.d.a&&q.d.h;
  const stars=quests.filter(fullQ).length,points=logs.length+Math.floor(stars/5);
  const wk=ymd(weekStart(now)),weekLogs=logs.filter(l=>weekKeyOf(l.date)===wk);
  const last=logs[logs.length-1]||null,since=last?daysBetween(last.date,today):null;

  if(logs.length){streak=1;for(let i=logs.length-1;i>0;i--){if(daysBetween(logs[i-1].date,logs[i].date)<=4)streak++;else break}if(since>4)streak=0}
  const ctx=badgeCtx(logs,chal,checks,per,quests),belt=beltFor(points);
  const needed=1+Math.floor(n/(4*per));
  const unlocked=!!cf.combatOpen||(belt.i>=2&&checks.length>=1);
  return {cf,now,today,logs,comments,checks,chal,n,per,week,key,wk,weekLogs,last,since,streak,belt,ctx,wn,wkey,wweek,quests,qToday,stars,points,unlocked,
    badges:BADGES.map(b=>Object.assign({},b,{got:b.t(ctx)})),doneToday:logs.filter(l=>l.date===today),
    checkDue:checks.length<needed||cf.checkReq,unseen:comments.filter(c=>!c.seen)};
}

function lastLine(d){

  return fmtDate(d.last.date)+'<br><small>'+(d.since===0?'اليوم':'منذ '+cnt(d.since,F_DAY))+(his?' · الساعة '+his+' عنده'+(mine&&mine!==his?' ('+mine+' عندك)':''):'')+'</small>';

function barChart(rows,goal){
  const W=330,H=150,pl=8,pr=8,pt=22,pb=26,n=rows.length,max=Math.max(goal,...rows.map(r=>r.v),1)+.6,bw=(W-pl-pr)/n,y=v=>pt+(H-pt-pb)*(1-v/max);
  let s='<svg viewBox="0 0 '+W+' '+H+'" class="chart" role="img" aria-label="عدد التمارين في كل أسبوع"><line class="goal" x1="'+pl+'" x2="'+(W-pr)+'" y1="'+y(goal)+'" y2="'+y(goal)+'"/><text x="'+(W-pr)+'" y="'+(y(goal)-5)+'" text-anchor="end">الهدف '+goal+'</text>';
  rows.forEach((r,i)=>{const x=W-pr-(i+1)*bw+bw*.18,w=bw*.64,yy=y(r.v);
    s+='<rect class="barr" x="'+x+'" y="'+(r.v?yy:H-pb-2)+'" width="'+w+'" height="'+(r.v?H-pb-yy:2)+'" rx="4" opacity="'+(r.v?1:.35)+'"/>'+(r.v?'<text class="val" x="'+(x+w/2)+'" y="'+(yy-4)+'" text-anchor="middle">'+r.v+'</text>':'')+'<text x="'+(x+w/2)+'" y="'+(H-8)+'" text-anchor="middle">'+r.l+'</text>'});
  return s+'</svg>';
}
function lineChart(vals,labels,min,max,aria){
  const W=330,H=150,pl=10,pr=22,pt=12,pb=26,n=vals.length,y=v=>pt+(H-pt-pb)*(1-(v-min)/(max-min)),step=n>1?(W-pl-pr)/(n-1):0;
  const x=i=>W-pr-i*step;let s='<svg viewBox="0 0 '+W+' '+H+'" class="chart" role="img" aria-label="'+aria+'">';
  for(let v=min;v<=max;v++)s+='<line class="grid" x1="'+pl+'" x2="'+(W-pr)+'" y1="'+y(v)+'" y2="'+y(v)+'"/><text x="'+(W-2)+'" y="'+(y(v)+4)+'" text-anchor="end">'+v+'</text>';
  const pts=vals.map((v,i)=>x(i)+','+y(v)).join(' ');
  s+=(n>1?'<polyline class="ln" points="'+pts+'"/>':'')+vals.map((v,i)=>'<circle class="pt" cx="'+x(i)+'" cy="'+y(v)+'" r="4.5"/>').join('');
  s+=labels.map((l,i)=>(n<=8||i%2===0)?'<text x="'+x(i)+'" y="'+(H-8)+'" text-anchor="middle">'+l+'</text>':'').join('');
  return s+'</svg>';
}

function lineChartN(vals,labels,min,max,aria){
  const W=330,H=140,pl=10,pr=34,pt=14,pb=26,n=vals.length,top=Math.max(max,min+1),y=v=>pt+(H-pt-pb)*(1-(v-min)/(top-min)),step=n>1?(W-pl-pr)/(n-1):0,x=i=>W-pr-i*step;

  s+=labels.map((l,i)=>'<text x="'+x(i)+'" y="'+(H-8)+'" text-anchor="middle">'+l+'</text>').join('');

  }else{
    const setTxt=st.sets?'<div class="dots">'+Array.from({length:st.sets},(_,k)=>'<i class="'+(k<st.set?'on':'')+'"></i>').join('')+'</div>':st.rounds?'<div class="rest-t">الجولة '+st.round+' من '+st.rounds+'</div>':'';
    const stage='<div class="stage" style="--tint:'+curTint()+'">'+figH(st.ex)+(EX[st.ex].react?'<div class="cue" id="cue"></div>':'')+'</div>';
    const head='<h2 class="ex-name">'+esc(st.name)+'</h2><p class="ex-how">'+esc(st.how)+'</p><div class="howbtn"><button class="chip" data-act="run-info">'+ic('play',16)+(EX[st.ex].yt?'شاهد الشرح':'طريقة الأداء')+'</button></div>';
    if(R.state==='cd')inner=stage+head+'<div class="cd num" id="rnum"></div>'+'<p class="rest-t">استعد...</p>'+setTxt+'<div class="run-actions"><button class="btn sec" data-act="run-skip">تخطّي التمرين</button></div>';
    else if(R.state==='work')inner=stage+head+ring()+setTxt+'<div class="run-actions"><button class="btn sec" data-act="run-pause">'+ic('pause',22)+'<span id="pl">إيقاف</span></button><button class="btn sec" data-act="run-skip">'+ic('skip',22)+'تخطّي</button></div>';
    else inner=stage+head+'<div class="target">'+st.reps+'<small>'+(st.reps>2?'مرات':'مرة')+(st.sets?' · المجموعة '+st.set+' من '+st.sets:'')+'</small></div>'+setTxt+'<div class="run-actions"><button class="btn good" data-act="run-done">'+ic('check',24)+'تمّت المجموعة</button></div>';
  }
  host.innerHTML=shell(inner,st);hydrate(host);
  if(R.state!=='reps')tick();
}
function tick(){
  if(R.paused)return;
  const left=Math.max(0,R.endAt-Date.now()),secs=Math.ceil(left/1000),n=$('#rnum'),fg=$('#rfg');
  if(n)n.textContent=secs;
  if(fg)fg.style.strokeDashoffset=String(377*(1-left/(R.total*1000)));
  if(secs!==R.last){R.last=secs;if(secs>0&&secs<=3)beep(R.state==='work'?1046:880,110);}
  const st=R.steps[R.i];
  if(R.state==='work'&&EX[st.ex].react){const now=Date.now();if(now>=R.cueAt){R.cueAt=now+1700;let k;do{k=Math.floor(Math.random()*CUES.length)}while(k===R.cue);R.cue=k;const c=$('#cue');if(c)c.innerHTML='<span>'+ic(CUES[k][1],30)+CUES[k][0]+'</span>';beep(660,70,.08)}}
  if(left<=0){
    clearInterval(R.iv);
    if(R.state==='cd'){R.state='work';R.total=st.secs;R.endAt=Date.now()+st.secs*1000;R.cueAt=0;drawRun();R.iv=setInterval(tick,100);beep(1318,220)}
    else if(R.state==='work'){R.done++;beep(1318,260);enter(R.i+1)}
    else if(R.state==='rest'){enter(R.i+1)}
  }
}
function runClick(act){
  const st=R.steps[R.i];
  if(act==='run-skip'){clearInterval(R.iv);if(st.kind==='work'&&R.state==='work')R.done++;enter(R.i+1)}
  else if(act==='run-done'){R.done++;beep(1318,200);enter(R.i+1)}
  else if(act==='run-add'){R.endAt+=10000;R.total+=10;tick()}
  else if(act==='run-pause'){R.paused=!R.paused;if(R.paused){R.left=R.endAt-Date.now()}else{R.endAt=Date.now()+R.left}const p=$('#pl');if(p)p.textContent=R.paused?'متابعة':'إيقاف'}
  else if(act==='run-sound'){R.sound=!R.sound;drawRun()}
  else if(act==='run-info'){if(!R.paused&&R.state!=='reps'&&R.state!=='rest'){R.paused=true;R.left=R.endAt-Date.now();R.vp=true}exinfo(st.ex)}
  else if(act==='run-quit'){
    const ratio=R.done/Math.max(1,R.sess.works);
    const keep=ratio>=.5;
    if(!R.paused&&R.state!=='reps'){R.paused=true;R.left=R.endAt-Date.now();R.auto=true}
    $('#runner').insertAdjacentHTML('beforeend','<div id="qsheet"><div class="scrim" style="z-index:60"></div><div class="sheet" style="z-index:61"><div class="sheet-h"><h3>إنهاء التمرين؟</h3></div><div class="sheet-b"><p class="muted">'+(keep?'أنجزت أكثر من نصف التمرين، ويمكنك حفظه كتمرين.':'أنجزت أقل من نصف التمرين. لا بأس، نجرّب مرة أخرى.')+'</p><button class="btn" data-act="run-resume">أكمل التمرين</button><button class="btn sec" data-act="run-end" data-keep="'+(keep?1:0)+'">'+(keep?'أنهِ واحفظ ما أنجزت':'خروج بدون حفظ')+'</button></div></div></div>');
  }
  else if(act==='run-resume'){const q=$('#qsheet');if(q)q.remove();if(R.auto){R.auto=false;R.paused=false;R.endAt=Date.now()+R.left}}
}
function finish(partial){
  clearInterval(R.iv);R.state='fin';unwake();R.partial=!!partial;
  R.fin={effort:null,sleep:null,energy:null,note:''};
  const d=derive(),dur=Math.min(90,Math.max(1,Math.round((Date.now()-R.t0)/60000)));R.mins=dur;
  const before=d.belt,after=beltFor(d.points+1),up=after.i>before.i;
  const conf=Array.from({length:22},(_,i)=>'<i style="left:'+(i*4.6+Math.random()*3)+'%;background:'+['#FFA91F','#12A58F','#5568E8','#E8694A','#F9D84A'][i%5]+';animation-delay:'+(Math.random()*2.4).toFixed(2)+'s"></i>').join('');
  beep(988,160);setTimeout(()=>beep(1318,300),170);
  const full=!partial&&R.done>=R.sess.works*.9;
  $('#runner').innerHTML='<div class="run" style="--tint:'+curTint()+'"><div class="confetti">'+conf+'</div><div class="run-in fin" style="position:relative">'+
    '<div style="text-align:center;margin-top:8px"><h2>'+(full?'أحسنت يا بطل!':'عمل جيد!')+'</h2><p class="muted">أنجزت '+cnt(R.done,F_EX)+' في '+cnt(dur,F_MIN)+'</p></div>'+
    (up?'<div class="belt-up">'+beltSVG(after.b.c,92)+'<div><h3>ترقّيت!</h3><p>حصلت على '+after.b.n+'</p></div></div>':'')+
    '<div class="osec">كيف كان التمرين؟</div><div class="faces">'+[1,2,3,4,5].map(n=>'<button class="facebtn" data-act="fin-eff" data-v="'+n+'" aria-pressed="false">'+face(n,44)+FACE_L[n]+'</button>').join('')+'</div>'+
    '<div class="field"><label class="lbl">كيف نمت البارحة؟ (اختياري)</label><div class="chips-row">'+[['low','قليلاً'],['ok','كفاية'],['great','ممتاز']].map(a=>'<button class="pill" data-act="fin-sleep" data-v="'+a[0]+'" aria-pressed="false">'+a[1]+'</button>').join('')+'</div></div>'+
    '<div class="field"><label class="lbl">وطاقتك اليوم؟ (اختياري)</label><div class="chips-row">'+[['low','منخفضة'],['mid','متوسطة'],['high','عالية']].map(a=>'<button class="pill" data-act="fin-energy" data-v="'+a[0]+'" aria-pressed="false">'+a[1]+'</button>').join('')+'</div></div>'+
    '<div class="field"><label class="lbl" for="fin-note">ملاحظة لأخيك (اختياري)</label><textarea id="fin-note" placeholder="مثلاً: القرفصاء كانت صعبة اليوم..." maxlength="300"></textarea></div>'+
    '<button class="btn" id="fin-save" data-act="fin-save" disabled style="margin-top:6px">اختر وجهاً أولاً</button></div></div>';
  R.up=up;
}
function endRun(keep){
  clearInterval(R.iv);unwake();
  if(keep){R.partial=true;finish(true)}else closeRunner();
}
function closeRunner(){clearInterval(R.iv);unwake();$('#runner').hidden=true;$('#runner').innerHTML='';document.body.style.overflow='';R.state='';render(true)}
async function saveRun(){
  const btn=$('#fin-save');if(btn){btn.disabled=true;btn.textContent='جارٍ الحفظ...'}
  R.fin.note=($('#fin-note')||{value:''}).value.trim();
  const d=derive(),now=new Date();
  const log={date:ymd(now),at:now.toISOString(),tz:(Intl.DateTimeFormat().resolvedOptions().timeZone)||'',sess:R.sess.key,idx:d.n,week:R.sess.week,level:d.cf.level,tired:R.sess.tired,partial:!!R.partial,
    effort:R.fin.effort,note:R.fin.note,sleep:R.fin.sleep,energy:R.fin.energy,mins:R.mins,done:R.done,total:R.sess.works};
  const id='L'+uid();
  const prevGot=new Set(d.badges.filter(b=>b.got).map(b=>b.id));
  await Store.put('logs',id,log);
  const d2=derive(),fresh=d2.badges.filter(b=>b.got&&!prevGot.has(b.id));
  S.tired=false;
  $('#runner').innerHTML='<div class="run" style="--tint:'+curTint()+'"><div class="run-in" style="justify-content:center;text-align:center"><div style="color:var(--good)">'+ic('check',64)+'</div><h2 style="font-size:34px">تم الحفظ</h2><p class="muted">'+(Store.mode==='local'?'حُفظ على هذا الجهاز.':'سيراه أخوك المدرب.')+'</p>'+
    (fresh.length?'<div class="osec">شارات جديدة!</div><div class="badges">'+fresh.map(b=>'<div class="bd"><div class="medal">'+ic(b.g,26)+'</div><b>'+b.n+'</b><span>'+b.d+'</span></div>').join('')+'</div>':'')+
    '<button class="btn" style="margin-top:18px" data-act="run-close">العودة للرئيسية</button></div></div>';
}

/* ============ fitness check ============ */
const CK={vals:{},timer:null,run:null};
function checkOpen(){
  CK.vals={};clearInterval(CK.timer);
  let o='<p class="muted">هذا ليس امتحاناً. نقيس لياقتك الآن، ثم نقارن بعد 4 أسابيع لترى تطوّرك. أجرِ ما تريد منها.</p>';
  chkList(cfg()).forEach(c=>{o+='<div class="card" style="display:grid;gap:8px"><h4 style="font-size:21px">'+c.n+'</h4><p class="muted" style="font-size:14px">'+c.how+'</p><div style="display:flex;gap:10px;align-items:center"><button class="btn sm sec" data-act="ck-timer" data-k="'+c.k+'" id="ckb-'+c.k+'">'+ic('timer',20)+(c.cd?'ابدأ 60 ثانية':'ابدأ العدّ')+'</button><span class="num" style="font-family:var(--display);font-size:26px;min-width:44px" id="ckt-'+c.k+'"></span><input class="inp" id="ck-'+c.k+'" type="number" inputmode="numeric" min="0" max="999" placeholder="'+c.u+'" style="max-width:130px;margin-inline-start:auto"></div></div>'});
  o+='<button class="btn" data-act="ck-save">حفظ النتائج</button>';
  openSheet('اختبار اللياقة',o);
}
function ckTimer(k){
  const c=CHECKS.find(x=>x.k===k),b=$('#ckb-'+k),t=$('#ckt-'+k),inp=$('#ck-'+k);
  if(CK.run===k){clearInterval(CK.timer);const el=Math.round((Date.now()-CK.t0)/1000);if(c.sw)inp.value=el;CK.run=null;b.innerHTML=ic('timer',20)+'ابدأ العدّ';return}
  clearInterval(CK.timer);CK.run=k;CK.t0=Date.now();
  if(c.cd){b.disabled=true;b.textContent='جارٍ العدّ...';CK.timer=setInterval(()=>{const l=Math.max(0,c.cd-Math.floor((Date.now()-CK.t0)/1000));t.textContent=l;if(l<=3&&l>0)beep(880,100);if(l<=0){clearInterval(CK.timer);CK.run=null;t.textContent='انتهى';beep(1318,350);b.disabled=false;b.innerHTML=ic('timer',20)+'أعد 60 ثانية'}},250);t.textContent=c.cd}
  else{b.innerHTML='إيقاف';CK.timer=setInterval(()=>{t.textContent=Math.floor((Date.now()-CK.t0)/1000)},250)}
}
async function ckSave(){
  const now=new Date(),rec={at:now.toISOString(),date:ymd(now),tz:(Intl.DateTimeFormat().resolvedOptions().timeZone)||''};let any=false;
  CHECKS.forEach(c=>{const v=parseInt(($('#ck-'+c.k)||{}).value,10);if(!isNaN(v)&&v>=0){rec[c.k]=v;any=true}});
  if(!any){toast('اكتب نتيجة واحدة على الأقل');return}
  clearInterval(CK.timer);closeSheet();
  await Store.put('checks','K'+uid(),rec);
  if(cfg().checkReq)await saveCfg({checkReq:false});
  toast('تم حفظ نتائج الاختبار');
}

/* ============ coach actions ============ */
async function sendComment(logId,text){
  text=(text||'').trim();if(!text)return toast('اكتب رسالة أولاً');
  await Store.put('comments','M'+uid(),{text:text.slice(0,400),at:new Date().toISOString(),log:logId||'',seen:false,react:false});
  toast('تم الإرسال');
}
function pinKey(v){
  const d=derive();
  if(v==='x'){S.pin=S.pin.slice(0,-1)}else if(S.pin.length<4){S.pin+=v}
  if(S.pin.length<4){render(true);return}
  const code=S.pin;S.pin='';
  if(!d.cf.pin){
    if(S.pinStep!=='b'){S.pinTmp=code;S.pinStep='b';render(true);return}
    if(code===S.pinTmp){S.pinStep='';S.pinTmp='';S.coachUntil=Date.now()+15*60000;saveCfg({pin:code}).then(()=>{toast('تم حفظ الرمز');render(true)})}
    else{S.pinStep='a';S.pinTmp='';toast('الرمزان غير متطابقين، حاول من جديد');render(true)}
  }else if(code===d.cf.pin){S.coachUntil=Date.now()+15*60000;render(true)}
  else{toast('الرمز غير صحيح');render(true)}
}

/* ============ events ============ */
document.addEventListener('click',e=>{
  const a=e.target.closest('[data-act]');if(!a)return;
  const act=a.dataset.act,v=a.dataset.v;
  if(act.indexOf('run-')===0&&act!=='run-end'&&act!=='run-close'){runClick(act);return}
  switch(act){
    case 'tab':if(v==='coach'&&!coachOK()){S.pin='';}go(v);break;
    case 'tired':S.tired=!S.tired;render(true);break;
    case 'start':startRun();break;
    case 'start-w':startRun(derive().wkey);break;
    case 'quest':{const d=derive(),rec=Object.assign({},(d.qToday&&d.qToday.d)||{}),k=a.dataset.k;rec[k]=!rec[k];
      Store.put('quests',d.today,{date:d.today,d:rec,at:new Date().toISOString(),tz:(Intl.DateTimeFormat().resolvedOptions().timeZone)||''});
      if(rec.b&&rec.a&&rec.h)toast('نجمة جديدة! أكملت مهام اليوم');break}
    case 'set-combat':saveCfg({combatOpen:!cfg().combatOpen});break;
    case 'peek':peek(a.dataset.key,a.dataset.week,a.dataset.lv);break;
    case 'pv-lv':S.pvLv=v;render(true);break;
    case 'pv-w':S.pvW=+v;render(true);break;
    case 'pv-gift':{const d=derive();showGift(Math.max(1,d.belt.i),true);break}
    case 'pv-war':showWar(true);break;
    case 'cele-open':openGift();break;
    case 'cele-close':closeCele();break;
    case 'exinfo':exinfo(a.dataset.ex);break;
    case 'vid-play':playVid(a.dataset.ex);break;
    case 'sheet-close':closeSheet();break;
    case 'planweek':S.planWeek=+a.dataset.w;render(true);break;
    case 'run-end':endRun(a.dataset.keep==='1');break;
    case 'run-close':closeRunner();break;
    case 'fin-eff':R.fin.effort=+v;document.querySelectorAll('.facebtn').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.v===v)));{const s=$('#fin-save');s.disabled=false;s.textContent='احفظ التمرين'}break;
    case 'fin-sleep':R.fin.sleep=R.fin.sleep===v?null:v;document.querySelectorAll('[data-act="fin-sleep"]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.v===R.fin.sleep)));break;
    case 'fin-energy':R.fin.energy=R.fin.energy===v?null:v;document.querySelectorAll('[data-act="fin-energy"]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.v===R.fin.energy)));break;
    case 'fin-save':saveRun();break;
    case 'chal-done':Store.put('challenges',a.dataset.id,{done:true,at:new Date().toISOString()});toast('أحسنت! أنجزت التحدي');break;
    case 'cm-thanks':{const c=Store.get('comments').find(x=>x.id===a.dataset.id);if(c)Store.put('comments',c.id,Object.assign({},c,{seen:true,react:true}));break}
    case 'cm-seen':{const c=Store.get('comments').find(x=>x.id===a.dataset.id);if(c)Store.put('comments',c.id,Object.assign({},c,{seen:true}));break}
    case 'check-open':checkOpen();break;
    case 'ck-timer':ckTimer(a.dataset.k);break;
    case 'ck-save':ckSave();break;
    case 'pin':pinKey(v);break;
    case 'csub':S.csub=v;render(true);break;
    case 'coach-lock':S.coachUntil=0;S.pin='';render(true);break;
    case 'cm-quick':sendComment(a.dataset.log,a.dataset.text);break;
    case 'cm-send':{const t=$('#cm-'+(a.dataset.log||'gen'));if(t){sendComment(a.dataset.log,t.value);t.value=''}break}
    case 'set-level':saveCfg({level:v});break;
    case 'set-per':saveCfg({perWeek:+v});break;
    case 'set-eq':{const c=cfg();saveCfg({equip:Object.assign({},c.equip,{[v]:!c.equip[v]})});break}
    case 'set-off':{const c=cfg();saveCfg({off:Object.assign({},c.off,{[v]:!c.off[v]})});break}
    case 'set-chal':saveCfg({challenge:a.dataset.text});break;
    case 'set-pin':saveCfg({pin:''});S.coachUntil=0;S.pin='';S.pinStep='a';toast('اختر رمزاً جديداً');break;
    case 'restart-ask':openSheet('إعادة بدء البرنامج','<p>سيبدأ البرنامج من الأسبوع الأول. تبقى كل تمارينه السابقة وشاراته محفوظة.</p><button class="btn" data-act="restart-go">نعم، أعد البدء</button><button class="btn sec" data-act="sheet-close">إلغاء</button>');break;
    case 'restart-go':saveCfg({programStartAt:new Date().toISOString()});closeSheet();toast('بدأ البرنامج من جديد');break;
    case 'check-req':saveCfg({checkReq:true});toast('تم طلب الاختبار');break;
  }
});
document.addEventListener('change',e=>{
  const t=e.target;if(t.dataset&&t.dataset.actIn==='name')saveCfg({name:t.value.trim().slice(0,20)});
  if(t.dataset&&t.dataset.actIn==='challenge')saveCfg({challenge:t.value.trim().slice(0,80)});
});
window.addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(['home','plan','me','coach'].includes(h)&&h!==S.tab){S.tab=h;render(true)}});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&R.state&&R.state!=='fin'&&R.state!==''&&!R.wl)wake()});
window.addEventListener('online',()=>schedule());

/* ============ boot ============ */
(function(){const h=location.hash.slice(1);if(['home','plan','me','coach'].includes(h))S.tab=h})();
render(true);
(async function(){
  let db=null;
  try{
    const t0=Date.now();
    while(!window.__darbDB&&Date.now()-t0<12000)await new Promise(r=>setTimeout(r,100));
    db=window.__darbDB?await window.__darbDB:null;
  }catch(e){db=null}
  Store.attach(db);
})();
if('serviceWorker' in navigator&&location.protocol!=='file:')window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{})});
window.__darb={EX,buildSession,mountFig,hydrate,SESS,figH,cfg,derive,Store,render,S,R,finish,enter};
})();
</script>
<script src="fb.js" defer></script>
